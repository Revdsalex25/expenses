<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="expenss.css">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="container">
<!--Add New Expense-->
<div class="card add-expenses">

    <h2><i class="fa-solid fa-circle-plus"></i> Add New Expense</h2>
    

    <form>
        <label>Amount(₦)</label>
        <input type="number" placeholder="0.00" required>

         <label>Description</label>
        <input type="text" placeholder="What did  you spend on?" required>

        <label>Category</label>
        <select required>
          <option value="">Select a category</option>
          <option>Food & Dining</option>
          <option>Transportation</option>
          <option>Shopping</option>
          <option>Entertainment</option>
          <option value="">Other</option>
          <option value="">Add Custom Category</option>
        </select>

       <label>Date</label>
        <input type="date">

        <button  class="add-btn">
            <i class="fa-solid fa-floppy-disk"></i> Add Expense
        </button>
        <button  class="export-btn">
            <i class="fa-solid fa-file-excel"></i> Export to Excel
        </button>
</form>
</div>

<!--Expense Overview -->
<div class="card Overview">
    <h2><i class="fa-solid fa-chart-bar"></i> Expenses Overview</h2>

 <div class="stats">
   
    <div class="stat-box">
    <h3>Today's Total</h3>
    <p>₦0.00</p>
   </div>

   <div class="stat-box">
    <h3>This Week</h3>
    <p>₦0.00</p>
   </div>
 </div>

   <div class="total">
    <h3>Total Expenses</h3>
    <p>₦0.00</p>
   </div>

   <div class="chart">
    <div class="days">
        <span>Tue</span>
        <span>Wed</span>
        <span>Thu</span>
        <span>Fri</span>
        <span>Sat</span>
        <span>Sun</span>
         <span>Mon</span>
    </div>
    <div class="expense-list">
        
     <p>No expenses recorded yet. Add your first expense!</p>
   </div>
 </div>
</div>
</div>
</body>
</html>
